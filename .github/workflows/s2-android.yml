name: S2 Android field graybox

on:
  push:
    branches: [main]
    paths: [s2/**, .github/workflows/s2-android.yml, .github/gut_check.py, .github/test_gut_check.py, .github/gut-times.json]
  pull_request:
    paths: [s2/**, .github/workflows/s2-android.yml, .github/gut_check.py, .github/test_gut_check.py, .github/gut-times.json]

permissions:
  contents: read

concurrency:
  group: s2-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GUT was most of a run (20 of 27 minutes on main 10-26), so its scripts run in
  # parallel shards. test-and-apk keeps the parse checks and the export. Three shards
  # since 11-03: with two, one shard ran 40~60 minutes and #1359's was cancelled by
  # the hour limit just after all its tests passed. Taking every third script of the
  # sorted list still gave 12 / 42 / 19 minutes (test_campaign_route.gd alone is 18),
  # so scripts go longest first to the least loaded shard by the seconds in
  # .github/gut-times.json (from the shards' gut-results.xml of run 2243; a script
  # not in it counts 10 s). That table splits the same scripts 24 / 24 / 24 minutes.
  gut:
    name: GUT ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      GODOT_VERSION: 4.7.2
      GUT_VERSION: 9.7.1
      GUT_SHARDS: 3
    steps:
      - uses: actions/checkout@v5

      - name: Download exact stable engine
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-stable"
          base="https://github.com/godotengine/godot-builds/releases/download/${release}"
          engine="Godot_v${release}_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot-download" s2/build
          cd "$RUNNER_TEMP/godot-download"
          curl --fail --location --retry 3 "$base/$engine" -o "$engine"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          python3 - "$engine" <<'PY'
          import hashlib, pathlib, sys
          sums = {}
          for line in pathlib.Path('SHA512-SUMS.txt').read_text().splitlines():
              fields = line.split()
              if len(fields) == 2:
                  sums[fields[1].lstrip('*')] = fields[0]
          for name in sys.argv[1:]:
              actual = hashlib.sha512(pathlib.Path(name).read_bytes()).hexdigest()
              if sums.get(name) != actual:
                  raise SystemExit(f'Checksum missing or mismatched: {name}')
              print(f'SHA512 verified: {name}')
          PY
          unzip -q "$engine" -d engine
          chmod +x "engine/Godot_v${release}_linux.x86_64"
          echo "GODOT_BIN=$PWD/engine/Godot_v${release}_linux.x86_64" >> "$GITHUB_ENV"
          "$PWD/engine/Godot_v${release}_linux.x86_64" --headless --version | tee "$GITHUB_WORKSPACE/s2/build/godot-version.txt"
          test "$(cut -d. -f1-4 "$GITHUB_WORKSPACE/s2/build/godot-version.txt")" = "${GODOT_VERSION}.stable"

      - name: Fetch GUT only in CI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/bitwes/Gut/archive/refs/tags/v${GUT_VERSION}.zip" -o "$RUNNER_TEMP/gut.zip"
          unzip -q "$RUNNER_TEMP/gut.zip" -d "$RUNNER_TEMP/gut"
          mkdir -p s2/addons
          gut_root="$RUNNER_TEMP/gut/Gut-${GUT_VERSION}"
          cp -a "$gut_root/addons/gut" s2/addons/gut
          test -s s2/addons/gut/LICENSE.md
          python3 -c "from pathlib import Path; Path('s2/tests/.gdignore').unlink()"

      - name: Import resources
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path s2 --editor --quit 2>&1 | tee s2/build/import.log
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('s2/build/import.log').read_text()
          if re.search(r'(?m)^(?:SCRIPT ERROR:|ERROR:)|Parse Error:', log):
              raise SystemExit('Godot import reported an error; inspect import.log')
          PY

      - name: Run this shard's GUT scripts
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          shard, total = int(os.environ['SHARD']), int(os.environ['GUT_SHARDS'])
          scripts = sorted(p.relative_to('s2').as_posix() for p in pathlib.Path('s2/tests').rglob('test_*.gd'))
          seconds = json.loads(pathlib.Path('.github/gut-times.json').read_text())
          loads = [0.0] * total
          mine = []
          for script in sorted(scripts, key=lambda s: (-seconds.get(s, 10), s)):
              least = min(range(total), key=lambda k: (loads[k], k))
              loads[least] += seconds.get(script, 10)
              if least == shard - 1:
                  mine.append(script)
          mine.sort()
          if not mine:
              raise SystemExit(f'shard {shard}/{total} got no test scripts')
          pathlib.Path('s2/build/gut-shard.txt').write_text(''.join(f'res://{s}\n' for s in mine))
          print(f'shard {shard}/{total}: {len(mine)} of {len(scripts)} test scripts, '
                f'about {loads[shard - 1] / 60:.1f} of {sum(loads) / 60:.1f} minutes by the table')
          PY
          # The pass check is tested first, so a broken check cannot wave the shard through.
          python3 .github/test_gut_check.py
          # No report or log from an earlier run may stand in for this one.
          rm -f s2/build/gut-results.xml s2/build/gut.log
          "$GODOT_BIN" --headless --path s2 --script addons/gut/gut_cmdln.gd \
            -gtest="$(paste -sd, s2/build/gut-shard.txt)" -gexit \
            -gjunit_xml_file=res://build/gut-results.xml 2>&1 | tee s2/build/gut.log
          # Require a real passing test report, even if runner exits zero: every `func test_` of every
          # script, under that script (a script GUT could not load cannot drop out silently, nor hide
          # behind another script's extra cases), all "pass", and no SCRIPT ERROR in the run log.
          python3 .github/gut_check.py s2/build/gut-shard.txt s2/build/gut-results.xml s2/build/gut.log

      - name: Upload GUT logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: s2-gut-${{ matrix.shard }}-${{ github.run_number }}
          path: |
            s2/build/*.log
            s2/build/*.xml
            s2/build/*.txt
          if-no-files-found: warn
          retention-days: 14

  test-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2
      GUT_VERSION: 9.7.1
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default list still asks for the removed 'tools' package.
          packages: platform-tools

      - name: Install Android build tools
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download exact stable engine and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-stable"
          base="https://github.com/godotengine/godot-builds/releases/download/${release}"
          engine="Godot_v${release}_linux.x86_64.zip"
          templates="Godot_v${release}_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-download" s2/build
          cd "$RUNNER_TEMP/godot-download"
          curl --fail --location --retry 3 "$base/$engine" -o "$engine"
          curl --fail --location --retry 3 "$base/$templates" -o "$templates"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          python3 - "$engine" "$templates" <<'PY'
          import hashlib, pathlib, sys
          sums = {}
          for line in pathlib.Path('SHA512-SUMS.txt').read_text().splitlines():
              fields = line.split()
              if len(fields) == 2:
                  sums[fields[1].lstrip('*')] = fields[0]
          for name in sys.argv[1:]:
              actual = hashlib.sha512(pathlib.Path(name).read_bytes()).hexdigest()
              if sums.get(name) != actual:
                  raise SystemExit(f'Checksum missing or mismatched: {name}')
              print(f'SHA512 verified: {name}')
          PY
          unzip -q "$engine" -d engine
          chmod +x "engine/Godot_v${release}_linux.x86_64"
          echo "$PWD/engine" >> "$GITHUB_PATH"
          echo "GODOT_BIN=$PWD/engine/Godot_v${release}_linux.x86_64" >> "$GITHUB_ENV"
          "$PWD/engine/Godot_v${release}_linux.x86_64" --headless --version | tee "$GITHUB_WORKSPACE/s2/build/godot-version.txt"
          test "$(cut -d. -f1-4 "$GITHUB_WORKSPACE/s2/build/godot-version.txt")" = "${GODOT_VERSION}.stable"
          unzip -q "$templates" -d unpacked
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          cp -a unpacked/templates/. "$template_dir/"

      - name: Fetch GUT only in CI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/bitwes/Gut/archive/refs/tags/v${GUT_VERSION}.zip" -o "$RUNNER_TEMP/gut.zip"
          unzip -q "$RUNNER_TEMP/gut.zip" -d "$RUNNER_TEMP/gut"
          mkdir -p s2/addons
          gut_root="$RUNNER_TEMP/gut/Gut-${GUT_VERSION}"
          cp -a "$gut_root/addons/gut" s2/addons/gut
          # Framework stays untracked; GUT ships its license inside addons/gut.
          test -s s2/addons/gut/LICENSE.md
          # Only the disposable CI checkout enables tests after GUT is present.
          python3 -c "from pathlib import Path; Path('s2/tests/.gdignore').unlink()"

      - name: Import resources and reject parse errors
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path s2 --editor --quit 2>&1 | tee s2/build/import.log
          # Parse every project and test script, so one run reports all parse errors.
          for script in $(cd s2 && find game scripts tests -name '*.gd' | sort); do
            echo "== check $script" | tee -a s2/build/import.log
            "$GODOT_BIN" --headless --path s2 --check-only --script "res://$script" 2>&1 | tee -a s2/build/import.log || true
          done
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('s2/build/import.log').read_text()
          if re.search(r'(?m)^(?:SCRIPT ERROR:|ERROR:)|Parse Error:', log):
              raise SystemExit('Godot import reported an error; inspect import.log')
          PY

      - name: Debug signing key (fixed one from secrets, else ephemeral) and Android editor settings
        shell: bash
        env:
          FIXED_KEYSTORE_B64: ${{ secrets.S2_DEBUG_KEYSTORE_B64 }}
          FIXED_KEYSTORE_PASSWORD: ${{ secrets.S2_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/s2-debug.keystore"
          if [ -n "$FIXED_KEYSTORE_B64" ] && [ -n "$FIXED_KEYSTORE_PASSWORD" ]; then
            # Same key every run, so a new APK installs over the last one on the phone.
            printf '%s' "$FIXED_KEYSTORE_B64" | base64 -d > "$key"
            password="$FIXED_KEYSTORE_PASSWORD"
            echo "::add-mask::$password"
            keytool -list -keystore "$key" -storepass "$password" -alias androiddebugkey > /dev/null
            echo "debug key: fixed (from secrets)"
          else
            password="$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            keytool -genkeypair -keystore "$key" -storepass "$password" -keypass "$password" \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 30 -storetype JKS -noprompt
            echo "debug key: ephemeral (no secrets)"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$key" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$password" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Export and verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path s2 --export-debug Android build/s2-field-debug.apk 2>&1 | tee s2/build/export.log
          test -s s2/build/s2-field-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose s2/build/s2-field-debug.apk | tee s2/build/signature.txt
          sha256sum s2/build/s2-field-debug.apk > s2/build/apk.sha256

      - name: Upload test logs and debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: s2-android-debug-${{ github.run_number }}
          path: |
            s2/build/*.apk
            s2/build/*.log
            s2/build/*.xml
            s2/build/*.txt
            s2/build/*.sha256
          if-no-files-found: warn
          retention-days: 14
