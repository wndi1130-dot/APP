name: S1 web checks

# S1(웹 TS)의 테스트·타입 검사·빌드·화면 스모크. S1↔S2 영수증 계약 테스트(s1/tests/receipt.test.ts)가
# S2의 GDScript 영수증 표본을 읽으므로, S2 쪽 영수증 파일을 바꾸는 PR에도 돈다.
# 프로필 필드 계약(s1/tests/profile_fields.test.ts)은 character_creation.md 9장의 id 목록을 읽으므로 그 문서가 바뀔 때도 돈다.
on:
  push:
    branches: [main]
    paths:
      - s1/**
      - s2/game/sim/receipt.gd
      - s2/tests/game/test_receipt.gd
      - s2/tests/game/fixtures/**
      - docs/design/briefs/character_creation.md
      - .github/workflows/s1-web.yml
  pull_request:
    paths:
      - s1/**
      - s2/game/sim/receipt.gd
      - s2/tests/game/test_receipt.gd
      - s2/tests/game/fixtures/**
      - docs/design/briefs/character_creation.md
      - .github/workflows/s1-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s1-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: s1

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: s1/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit, receipt contract and profile tests
        run: npm test

      - name: Typecheck and Vite build
        run: npm run build

      - name: Content validator on game data and fixtures
        run: |
          set -euo pipefail
          npm run -s validate -- ./data
          npm run -s validate -- fixtures/valid
          # 실패 예제는 반드시 실패해야 한다.
          if npm run -s validate -- fixtures/invalid > /dev/null; then
            echo 'fixtures/invalid가 검사를 통과했다' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: s1-dist-${{ github.run_number }}
          path: s1/dist
          retention-days: 7

  screen-smoke:
    # 빌드한 화면을 가로 844×390으로 한 판 넘기며 넘침·잘림·작은 글자를 검사한다(tools/screenshots.cjs).
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: s1/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: s1-dist-${{ github.run_number }}
          path: s1/dist

      - name: Cache Korean font package
        uses: actions/cache@v4
        with:
          path: ~/ci-debs
          key: fonts-noto-cjk-${{ runner.os }}-noble-v1

      - name: Korean font
        # 글꼴 꾸러미(61MB)를 우분투 거울이 수 분씩 찔끔찔끔 보내 단계 시간이 다 간 적이 세 번 있다(10-07).
        # 한 번 받은 .deb는 캐시에 두고, 받을 때는 한 번에 4분까지만 기다리며 두 번 시도한다(반쯤 받은 파일은 dpkg-deb로 걸러 지움).
        timeout-minutes: 10
        run: |
          set -euo pipefail
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts
          mkdir -p ~/ci-debs
          if ! ls ~/ci-debs/fonts-noto-cjk_*.deb >/dev/null 2>&1; then
            sudo apt-get update -q
            for try in 1 2; do
              if (cd ~/ci-debs && timeout 240 apt-get download fonts-noto-cjk) \
                && dpkg-deb -c ~/ci-debs/fonts-noto-cjk_*.deb >/dev/null; then break; fi
              rm -f ~/ci-debs/*.deb
              [ "$try" = 2 ] && exit 1
            done
          fi
          sudo dpkg -i ~/ci-debs/fonts-noto-cjk_*.deb
          fc-list : family | grep -F 'Noto Sans CJK KR' >/dev/null

      - name: Playwright Chromium
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Screen smoke
        run: SCREENSHOT_DIR="$RUNNER_TEMP/s1-shots" node tools/screenshots.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-screens-${{ github.run_number }}
          path: ${{ runner.temp }}/s1-shots
          if-no-files-found: warn
          retention-days: 7
